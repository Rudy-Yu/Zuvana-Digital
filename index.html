<style>
:root{--navy:#0B1F4B;--navy2:#18387A;--blue:#1F6BFF;--lb:#8DB8FF;--pale:#F1F5FF;--num:#D3E2FF;--gray:#5B6784}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--navy);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
a{color:inherit;text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .2s,box-shadow .2s,background .2s}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 10px 28px rgba(31,107,255,.35)}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(31,107,255,.5)}
.btn-g{border:1.5px solid rgba(255,255,255,.35);color:#fff}
.btn-g:hover{background:rgba(255,255,255,.1)}
.btn-s{background:#10b981;color:#fff;box-shadow:0 10px 25px rgba(16,185,129,.35);font-size:15px;padding:14px 28px}
.btn-s:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(16,185,129,.5);background:#059669}

/* Announcement Top Bar */
.top-bar{background:linear-gradient(90deg,#0b1f4b,#1F6BFF);color:#fff;text-align:center;padding:10px 16px;font-size:13px;font-weight:600}
.top-bar a{color:#34E3CB;margin-left:8px;text-decoration:underline;font-weight:700}

/* hero */
.hw{background:var(--blue);clip-path:polygon(0 0,100% 0,100% calc(100% - 44px),0 100%)}
.hero{background:var(--navy);color:#fff;clip-path:polygon(0 0,100% 0,100% calc(100% - 52px),0 calc(100% - 9px));padding:28px 0 150px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(141,184,255,.18) 1.2px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000);mask-image:linear-gradient(90deg,transparent 30%,#000)}
.nav{display:flex;align-items:center;justify-content:space-between;position:relative}
.logo{display:flex;align-items:center;gap:14px}
.lg{width:52px;height:52px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 1px rgba(141,184,255,.25)}.wm{display:grid;line-height:1.05}.wm b{font-size:20px;font-weight:700;letter-spacing:.24em}.wm i{font-style:normal;font-size:10.5px;font-weight:500;letter-spacing:.66em;margin-top:5px;background:linear-gradient(90deg,#34E3CB,#5B9BFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav ul{display:flex;gap:30px;list-style:none;font-size:14px;font-weight:500;color:#cfdcf7}
.nav ul a:hover{color:#fff}
.nav .btn{padding:10px 20px;font-size:13px}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;margin-top:76px;position:relative}
.tag{font-size:12px;font-weight:500;letter-spacing:.22em;color:var(--lb);margin-bottom:18px}
h1{font-size:clamp(34px,5.2vw,58px);line-height:1.12;font-weight:700;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--lb)}
.sub{margin:22px 0 34px;color:#cfdcf7;font-size:17px;max-width:520px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.mock{background:#fff;color:var(--navy);border-radius:20px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:fl 6s ease-in-out infinite;position:relative}
@keyframes fl{50%{transform:translateY(-12px)}}
.dots{display:flex;gap:6px;margin-bottom:16px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--num)}
.mock h4{font-size:13px;color:var(--gray);font-weight:500;margin-bottom:14px}
.flow{display:grid;gap:10px}
.node{display:flex;align-items:center;gap:12px;background:var(--pale);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.node b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;font-size:13px}
.node:nth-child(3) b{background:var(--blue)}
.line{height:14px;width:2px;background:var(--blue);margin:-6px 0 -6px 27px}
.pill{position:absolute;right:-14px;bottom:-16px;background:var(--blue);color:#fff;font-size:12px;font-weight:600;padding:8px 16px;border-radius:999px;box-shadow:0 10px 24px rgba(31,107,255,.45)}

/* sections */
section{padding:84px 0}
.h2{font-size:clamp(26px,3.4vw,38px);font-weight:700;line-height:1.2}
.h2:after{content:"";display:block;width:56px;height:5px;border-radius:3px;background:var(--blue);margin-top:14px}
.lead{color:var(--gray);margin-top:18px;max-width:600px}

/* Ready Template Section */
.ready-sec{background:linear-gradient(180deg,#fff 0%,#f1f5ff 100%);padding:80px 0;border-bottom:1px solid #e1e8f7}
.prod-box{background:#fff;border:2px solid #1F6BFF;border-radius:26px;padding:36px;margin-top:36px;display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;box-shadow:0 20px 50px rgba(11,31,75,.08);position:relative;overflow:hidden}
.prod-tag{position:absolute;top:18px;right:-35px;background:#10b981;color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;padding:5px 40px;transform:rotate(45deg)}
.prod-badge{display:inline-block;background:#e0e7ff;color:#3730a3;font-size:12px;font-weight:700;letter-spacing:.12em;padding:5px 14px;border-radius:999px;margin-bottom:14px}
.prod-title{font-size:26px;font-weight:700;line-height:1.25;color:var(--navy);margin-bottom:12px}
.prod-desc{color:var(--gray);font-size:14.5px;margin-bottom:20px}
.prod-list{list-style:none;display:grid;gap:10px;font-size:14px;margin-bottom:24px}
.prod-list li{display:flex;align-items:center;gap:8px}
.prod-list li:before{content:"✓";color:#10b981;font-weight:700}
.price-row{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;background:#f8fafc;padding:12px 18px;border-radius:14px;width:fit-content}
.price-row .now{font-size:32px;font-weight:800;color:var
